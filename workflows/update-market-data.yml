name: Update Taiwan Market Data

on:
  workflow_dispatch:
    inputs:
      full_update:
        description: "完整重新抓取一年資料"
        required: false
        default: false
        type: boolean

  schedule:
    # GitHub Actions cron 使用 UTC。
    # 08:30 UTC = 台灣時間 16:30。
    # 星期一至星期五執行。
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        run: |
          cp config.example.json config.json

      - name: Update market data
        shell: bash
        run: |
          set -euo pipefail

          DB_FILE="public/data/market_dashboard.sqlite3"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ inputs.full_update }}" == "true" ]]; then

            echo "執行手動完整更新"
            python collector.py \
              --config config.json \
              --years 1 \
              --full

          elif [[ ! -f "$DB_FILE" ]]; then

            echo "找不到既有 SQLite，首次建立一年資料"
            python collector.py \
              --config config.json \
              --years 1 \
              --full

          else

            echo "保留既有 SQLite，只更新最近 7 天"
            python collector.py \
              --config config.json \
              --years 1 \
              --refresh-days 7
          fi

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          json_file = Path("public/data/market-dashboard.json")
          csv_file = Path("public/data/market-dashboard.csv")
          db_file = Path("public/data/market_dashboard.sqlite3")

          for path in (json_file, csv_file, db_file):
              if not path.exists():
                  raise SystemExit(f"找不到輸出檔案：{path}")

              if path.stat().st_size == 0:
                  raise SystemExit(f"輸出檔案為空：{path}")

          with json_file.open("r", encoding="utf-8") as fh:
              payload = json.load(fh)

          if not payload.get("series"):
              raise SystemExit("JSON series 沒有資料")

          if not payload.get("latest_date"):
              raise SystemExit("JSON latest_date 不存在")

          with sqlite3.connect(db_file) as con:
              count = con.execute(
                  "SELECT COUNT(*) FROM daily"
              ).fetchone()[0]

          if count == 0:
              raise SystemExit("SQLite daily 資料表沒有資料")

          print(f"JSON 最新日期：{payload['latest_date']}")
          print(f"SQLite 筆數：{count}")
          PY

      - name: Commit updated market data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            public/data/market-dashboard.json \
            public/data/market-dashboard.csv \
            public/data/market_dashboard.sqlite3

          if git diff --cached --quiet; then
            echo "市場資料沒有變更，不建立 commit"
            exit 0
          fi

          git commit -m "chore(data): update market data $(date -u +'%Y-%m-%d')"
          git push origin main