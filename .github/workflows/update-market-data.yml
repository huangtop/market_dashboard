name: Update Market Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "手動執行模式"
        required: true
        default: "taiwan-latest"
        type: choice
        options:
          - taiwan-latest
          - global-latest
          - latest
          - backfill-5y
          - refresh-global
          - derive-only

  schedule:
    # GitHub Actions cron 使用 UTC。
    # 00:00 UTC = 台灣時間 08:00：美股/全球市場收盤後更新，只連 Yahoo。
    - cron: "0 0 * * 2-6"
    # 13:00 UTC = 台灣時間 21:00：台股收盤後更新，只連 TWSE。
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # push 前會 rebase；這裡保留足夠歷史，避免排程重疊或人工 commit 造成 non-fast-forward。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        run: |
          cp config.example.json config.json

      - name: Update market data
        shell: bash
        run: |
          set -euo pipefail

          DB_FILE="public/data/market_dashboard.sqlite3"

          if [[ ! -f "$DB_FILE" ]]; then
            echo "找不到既有 SQLite，首次建立五年資料"
            python collector.py --config config.json --years 5 --backfill
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 0 * * 2-6" ]]; then
              echo "08:00 台灣時間：全球市場更新；只連 Yahoo，不連 TWSE"
              python collector.py --config config.json --years 5 --global-latest
            elif [[ "${{ github.event.schedule }}" == "0 13 * * 1-5" ]]; then
              echo "21:00 台灣時間：台股更新；只連 TWSE，不連 Yahoo"
              python collector.py --config config.json --years 5 --taiwan-latest
            else
              echo "未知 schedule：${{ github.event.schedule }}"
              exit 1
            fi
            exit 0
          fi

          case "${{ inputs.mode }}" in
            taiwan-latest)
              echo "手動：台股最新；只連 TWSE"
              python collector.py --config config.json --years 5 --taiwan-latest
              ;;
            global-latest)
              echo "手動：全球市場最新；只連 Yahoo"
              python collector.py --config config.json --years 5 --global-latest
              ;;
            latest)
              echo "手動：台股 + 全球市場最新"
              python collector.py --config config.json --years 5 --latest
              ;;
            backfill-5y)
              echo "手動：五年歷史增量回補"
              python collector.py --config config.json --years 5 --backfill
              ;;
            refresh-global)
              echo "手動：重建全球市場交易日曆；只連 Yahoo"
              python collector.py --config config.json --years 5 --refresh-global-only
              ;;
            derive-only)
              echo "手動：只讀 SQLite 重算 JSON/CSV；不連網"
              python collector.py --config config.json --years 5 --derive-only
              ;;
            *)
              echo "未知 mode：${{ inputs.mode }}"
              exit 1
              ;;
          esac

      - name: Validate generated files and schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import sqlite3
          from pathlib import Path

          EXPECTED_SCHEMA = "4.8-global-latest"

          json_file = Path("public/data/market-dashboard.json")
          csv_file = Path("public/data/market-dashboard.csv")
          db_file = Path("public/data/market_dashboard.sqlite3")

          for path in (json_file, csv_file, db_file):
              if not path.exists():
                  raise SystemExit(f"找不到輸出檔案：{path}")
              if path.stat().st_size == 0:
                  raise SystemExit(f"輸出檔案為空：{path}")

          with json_file.open("r", encoding="utf-8") as fh:
              payload = json.load(fh)

          schema = payload.get("meta", {}).get("schema_version")
          if schema != EXPECTED_SCHEMA:
              raise SystemExit(f"schema_version 錯誤：預期 {EXPECTED_SCHEMA}，實際 {schema}")

          series = payload.get("series") or []
          latest = payload.get("latest") or {}
          latest_date = payload.get("latest_date")
          source_dates = payload.get("latest_source_dates") or {}
          global_latest = payload.get("global_latest") or {}

          if not global_latest:
              raise SystemExit("JSON global_latest 不存在或為空")

          for field in ("sp500", "nasdaq", "dow", "sox", "vix", "us10y"):
              if global_latest.get(field) is None:
                  raise SystemExit(f"global_latest.{field} 為空")
              if not global_latest.get(f"{field}_date"):
                  raise SystemExit(f"global_latest.{field}_date 為空")

          for field in (
              "sp500_change_pct", "nasdaq_change_pct", "dow_change_pct",
              "sox_change_pct", "vix_change_pct", "us10y_change_bp"
          ):
              if global_latest.get(field) is None:
                  raise SystemExit(f"global_latest.{field} 為空")

          if not series:
              raise SystemExit("JSON series 沒有資料")
          if not latest_date:
              raise SystemExit("JSON latest_date 不存在")

          required_latest = (
              "taiex", "taiex_change_pct",
              "tsmc", "tsmc_change_pct",
              "foreign_net_100m",
              "sp500", "sp500_change_pct",
              "nasdaq", "nasdaq_change_pct",
              "dow", "dow_change_pct",
              "sox", "sox_change_pct",
              "vix", "vix_change_pct",
              "us10y", "us10y_change_bp",
          )
          for field in required_latest:
              value = latest.get(field)
              if value is None:
                  raise SystemExit(f"latest.{field} 為空")
              if isinstance(value, (int, float)) and not math.isfinite(value):
                  raise SystemExit(f"latest.{field} 不是有限數值：{value}")

          required_global = ("usdtwd", "dxy", "vix", "sp500", "nasdaq", "dow", "sox", "us10y")
          for field in required_global:
              source_date = source_dates.get(field)
              row_source_date = latest.get(f"{field}_date")
              if not source_date:
                  raise SystemExit(f"latest_source_dates.{field} 為空")
              if row_source_date != source_date:
                  raise SystemExit(f"{field} source date 不一致：{row_source_date} != {source_date}")
              if source_date >= latest_date:
                  raise SystemExit(
                      f"{field} source date 不符合 completed-session 規則："
                      f"{source_date} >= {latest_date}"
                  )

          with sqlite3.connect(db_file) as con:
              tables = {
                  row[0]
                  for row in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              for table in ("daily", "global_daily"):
                  if table not in tables:
                      raise SystemExit(f"SQLite 缺少資料表：{table}")

              daily_columns = {
                  row[1] for row in con.execute("PRAGMA table_info(daily)")
              }
              for col in ("taiex_change_pct", "tsmc_change_pct"):
                  if col not in daily_columns:
                      raise SystemExit(f"daily 缺少欄位：{col}")

              global_columns = {
                  row[1] for row in con.execute("PRAGMA table_info(global_daily)")
              }
              required_global_columns = {
                  "date", "usdtwd", "dxy", "vix", "sp500",
                  "nasdaq", "dow", "sox", "us10y"
              }
              missing = required_global_columns - global_columns
              if missing:
                  raise SystemExit("global_daily 缺少欄位：" + ", ".join(sorted(missing)))

              daily_count = con.execute("SELECT COUNT(*) FROM daily").fetchone()[0]
              global_count = con.execute("SELECT COUNT(*) FROM global_daily").fetchone()[0]

              us10y_date = latest.get("us10y_date")
              us10y_rows = con.execute(
                  "SELECT COUNT(*) FROM global_daily WHERE date=? AND us10y IS NOT NULL",
                  (us10y_date,),
              ).fetchone()[0]
              if us10y_rows == 0:
                  raise SystemExit(f"global_daily 找不到 US10Y source row：{us10y_date}")

          rolling = (
              payload.get("analytics", {})
              .get("rolling_correlations", {})
              .get("60d", {})
              .get("us10y")
          )
          if not isinstance(rolling, dict) or "value" not in rolling:
              raise SystemExit("analytics.rolling_correlations.60d.us10y 不存在")

          print(f"schema：{schema}")
          print(f"台灣最新日期：{latest_date}")
          print(f"TAIEX：{latest.get('taiex')} / daily {latest.get('taiex_change_pct')}%")
          print(f"TSMC：{latest.get('tsmc')} / daily {latest.get('tsmc_change_pct')}%")
          print(f"S&P500 daily：{latest.get('sp500_change_pct')}%")
          print(f"SOX daily：{latest.get('sox_change_pct')}%")
          print(f"VIX daily：{latest.get('vix_change_pct')}%")
          print(f"US10Y：{latest.get('us10y')}%")
          print(f"US10Y change：{latest.get('us10y_change_bp')} bp")
          print(f"US10Y source：{latest.get('us10y_date')}")
          print(
              "global_latest："
              f"S&P500 {global_latest.get('sp500')} ({global_latest.get('sp500_date')}), "
              f"SOX {global_latest.get('sox')} ({global_latest.get('sox_date')}), "
              f"VIX {global_latest.get('vix')} ({global_latest.get('vix_date')}), "
              f"US10Y {global_latest.get('us10y')} ({global_latest.get('us10y_date')})"
          )
          print(f"SQLite daily：{daily_count} rows")
          print(f"SQLite global_daily：{global_count} rows")
          print("Validation PASS")
          PY

      - name: Commit updated market data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            public/data/market-dashboard.json \
            public/data/market-dashboard.csv \
            public/data/market_dashboard.sqlite3

          if git diff --cached --quiet; then
            echo "市場資料沒有變更，不建立 commit"
            exit 0
          fi

          git commit -m "chore(data): update market data $(date -u +'%Y-%m-%d %H:%M UTC')"

          # main 可能在 workflow 執行期間收到人工 commit。
          # 先 rebase 再 push，降低 non-fast-forward 失敗機率。
          for attempt in 1 2 3; do
            echo "push attempt $attempt"
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "三次 rebase/push 仍失敗"
          exit 1
