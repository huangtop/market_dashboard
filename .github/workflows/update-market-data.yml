name: Update Taiwan Market Data

on:
  workflow_dispatch:
    inputs:
      backfill_5y:
        description: "補齊最近五年缺漏資料（首次建立或歷史回補時使用）"
        required: false
        default: false
        type: boolean

  schedule:
    # GitHub Actions cron 使用 UTC。
    # 星期一至星期五執行。
    # 13:00 UTC = 台灣時間 21:00
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime config
        run: |
          cp config.example.json config.json

      - name: Update market data
        shell: bash
        run: |
          set -euo pipefail

          DB_FILE="public/data/market_dashboard.sqlite3"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ inputs.backfill_5y }}" == "true" ]]; then

            echo "執行五年歷史增量回補"
            python collector.py \
              --config config.json \
              --years 5 \
              --backfill

          elif [[ ! -f "$DB_FILE" ]]; then

            echo "找不到既有 SQLite，首次建立五年資料"
            python collector.py \
              --config config.json \
              --years 5 \
              --backfill

          else

            echo "保留既有 SQLite，只更新最新交易日；JSON/CSV 保留五年歷史"
            python collector.py \
              --config config.json \
              --years 5 \
              --latest
          fi

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          json_file = Path("public/data/market-dashboard.json")
          csv_file = Path("public/data/market-dashboard.csv")
          db_file = Path("public/data/market_dashboard.sqlite3")

          for path in (json_file, csv_file, db_file):
              if not path.exists():
                  raise SystemExit(f"找不到輸出檔案：{path}")
              if path.stat().st_size == 0:
                  raise SystemExit(f"輸出檔案為空：{path}")

          with json_file.open("r", encoding="utf-8") as fh:
              payload = json.load(fh)

          series = payload.get("series") or []
          if not series:
              raise SystemExit("JSON series 沒有資料")

          latest_date = payload.get("latest_date")
          if not latest_date:
              raise SystemExit("JSON latest_date 不存在")

          first_date = series[0].get("date")
          last_date = series[-1].get("date")

          with sqlite3.connect(db_file) as con:
              count = con.execute(
                  "SELECT COUNT(*) FROM daily"
              ).fetchone()[0]

              complete_count = con.execute(
                  """
                  SELECT COUNT(*)
                  FROM daily
                  WHERE taiex IS NOT NULL
                    AND tsmc IS NOT NULL
                    AND margin_balance_billion IS NOT NULL
                    AND maintenance_est IS NOT NULL
                    AND foreign_net_100m IS NOT NULL
                  """
              ).fetchone()[0]

          if count == 0:
              raise SystemExit("SQLite daily 資料表沒有資料")

          print(f"JSON 筆數：{len(series)}")
          print(f"JSON 範圍：{first_date} ~ {last_date}")
          print(f"JSON 最新日期：{latest_date}")
          print(f"SQLite 筆數：{count}")
          print(f"SQLite 完整交易日：{complete_count}")
          PY

      - name: Commit updated market data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            public/data/market-dashboard.json \
            public/data/market-dashboard.csv \
            public/data/market_dashboard.sqlite3

          if git diff --cached --quiet; then
            echo "市場資料沒有變更，不建立 commit"
            exit 0
          fi

          git commit -m "chore(data): update market data $(date -u +'%Y-%m-%d')"
          git push origin main